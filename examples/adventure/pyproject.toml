[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adventure"
version = "0.1.0"
description = "An open-ended, D&D-style text adventure where the LLM invents (and saves) the world as you play"
requires-python = ">=3.11"
dependencies = [
    "llm-interaction",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
adventure = "adventure.app:main"

[tool.uv.sources]
llm-interaction = { path = "../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["adventure"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["adventure"]
